name: Price Check

on:
     name: Price Check
on:
     schedule:
       - cron: '*/5 * * * *'    # backup safety net, every 5 minutes
     workflow_dispatch:          # allows manual trigger from Actions tab
     repository_dispatch:
       types: [price-check]      # triggered externally every 1-2 min by cron-job.org
concurrency:
  group: price-check
  cancel-in-progress: false
permissions:
  contents: write

permissions:
  contents: write            # needed so the workflow can commit updated state files

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price alert script
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/price_alert.py

      - name: Commit updated state files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ config/
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
